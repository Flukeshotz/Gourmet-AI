services:
  - type: web
    name: gourmet-ai-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && uvicorn src.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
